spring.application.name=gestion-leads-backend
server.address=127.0.0.1
server.port=8096

# Base relacional local persistente. Puede reemplazarse por la base acordada por el equipo.
spring.datasource.url=${BUSINESS_DB_URL:jdbc:h2:file:./datos/clientes;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${BUSINESS_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${BUSINESS_DB_USER:sa}
spring.datasource.password=${BUSINESS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jersey.servlet.load-on-startup=1

# Lista de orígenes del frontend. Ajustar cuando el equipo defina su dirección.
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
